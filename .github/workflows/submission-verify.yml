name: submission-verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install data-free verification dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify committed release tree
        run: python scripts/verify_submission_checkout.py

      - name: Reconstruct pinned sparse upstream checkout
        shell: bash
        run: |
          set -euo pipefail
          UP=evaluation/submission-20260919/upstream
          git clone --filter=blob:none --no-checkout             https://github.com/open-spaced-repetition/srs-benchmark "$UP"
          git -C "$UP" sparse-checkout set --no-cone             '/*' '!/plots/' '!/result-20k/' '!/notebook/' '!/weights/'             '!/pretrain/' '!/result/' '!/rwkv/' '!/reptile/'
          git -C "$UP" checkout bd9110f791e5b37282c55a9aa8db35f68f0c4aa2

      - name: Verify exact upstream source identity
        run: >-
          python scripts/verify_submission_checkout.py
          --upstream evaluation/submission-20260919/upstream

      - name: Run synthetic/provenance acceptance tests
        run: >-
          python -m pytest -q
          evaluation/submission-20260919/test_submission.py
          evaluation/submission-20260919/test_baseline.py
          evaluation/submission-20260919/test_hardening.py
